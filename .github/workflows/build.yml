name: Build and push docker image

on:
  workflow_call:
    inputs:
      AWS_REGION:
        required: false
        type: string
        default: "eu-central-1"
      ECR_REPOSITORY:
        required: false
        type: string
        default: ${{ github.event.repository.name }}
    outputs:
      image_name:
        description: "Image name"
        value: ${{ jobs.build.outputs.image }}
      image_tag:
        description: "Image tag"
        value: ${{ jobs.build.outputs.image_tag }}

    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-image-name.outputs.image }}
      image_tag: ${{ steps.set-image-tag.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.AWS_REGION }}
          mask-aws-account-id: no

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag in output
        id: "set-image-tag"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_SHA: ${{ github.sha }}
        run: |-
          sanitize_tag_part() {
            printf '%s' "$1" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's|[^a-z0-9._-]+|-|g; s/[-.]+$//; s/^[-.]+//; s/-+/-/g'
          }

          REF_NAME="$(sanitize_tag_part "$GITHUB_REF_NAME")"
          HEAD_REF="$(sanitize_tag_part "$GITHUB_HEAD_REF")"

          IMAGE_TAG="$(
          if ([ "$GITHUB_REF_NAME" == "main" ] || [ "$GITHUB_REF_NAME" == "master" ]) && [ "$GITHUB_EVENT_NAME" == "push" ]; then
            printf 'DEV-%s' "$GITHUB_SHA"
          elif [ "$GITHUB_EVENT_NAME" == "release" ] && [ "$GITHUB_EVENT_ACTION" == "released" ]; then
            printf 'PROD-%s' "$REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" == "pull_request" ] && ([ "$GITHUB_EVENT_ACTION" == "opened" ] || [ "$GITHUB_EVENT_ACTION" == "synchronize" ] || [ "$GITHUB_EVENT_ACTION" == "closed" ]); then
            printf 'PREVIEW-%s' "$HEAD_REF"
          else
            printf 'unknown'
          fi
          )"

          printf 'image_tag=%s\n' "$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Fail job if unknown image tag
        if: steps.set-image-tag.outputs.image_tag == 'unknown'
        run: |-
          echo "The event that triggered this workflow did not correspond to the known workflows for the different environments. Check the previous step."
          exit 1

      - name: Build, tag, and push image to Amazon ECR
        if: github.event.action != 'closed'
        id: build-image
        env:
          IMAGE: "${{ steps.login-ecr.outputs.registry }}/${{ inputs.ECR_REPOSITORY }}"
          TAG: "${{ steps.set-image-tag.outputs.image_tag }}"
        run: |
          docker build -t $IMAGE:$TAG .
          docker push $IMAGE:$TAG

      - name: Set image name in output
        id: set-image-name
        env:
          IMAGE: "${{ steps.login-ecr.outputs.registry }}/${{ inputs.ECR_REPOSITORY }}"
        run: |
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
