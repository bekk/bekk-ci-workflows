name: Deploy

on:
  workflow_call: 
    inputs:
      IMAGE_NAME:
        required: true
        type: string
      IMAGE_TAG:
        required: true
        type: string
      TERRAFORM_WORKSPACE:
        required: true
        type: string
      TERRAFORM_VAR_FILE:
        required: false
        type: string
        default: "dev.tfvars"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      SSH_PRIVATE_KEY:
        required: true

jobs:
  terraform:
    name: Run terraform
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-${{ github.repository }}-${{ inputs.TERRAFORM_WORKSPACE }}
      cancel-in-progress: false

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set up SSH key for custom terraform module
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add profile credentials to ~/.aws/credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile deploy
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile deploy

      - name: Terraform Format
        working-directory: terraform
        id: fmt
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: terraform
        id: init
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        id: validate
        run: terraform validate -no-color

      - name: Set terraform workspace variable
        id: tf-workspace
        env:
          TERRAFORM_WORKSPACE: ${{ inputs.TERRAFORM_WORKSPACE }}
        run: |
          sanitize_tag_part() {
            printf '%s' "$1" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's|[^a-z0-9-]+|-|g; s/-+$//; s/^-+//; s/-+/-/g'
          }

          if [ "$TERRAFORM_WORKSPACE" = '$GITHUB_HEAD_REF' ]; then
            unsanitized_workspace_name="$GITHUB_HEAD_REF"
          else
            unsanitized_workspace_name="$TERRAFORM_WORKSPACE"
          fi

          printf 'WORKSPACE=%s\n' "$(sanitize_tag_part "$unsanitized_workspace_name")" >> "$GITHUB_ENV"

      - name: Create and change Terraform workspace
        working-directory: terraform
        id: workspace
        run: |
          terraform workspace select -or-create "$WORKSPACE"

      - name: Deploy environment
        working-directory: terraform
        id: deploy_review
        env:
          TERRAFORM_VAR_FILE: ${{ inputs.TERRAFORM_VAR_FILE }}
          IMAGE_NAME: ${{ inputs.IMAGE_NAME }}
          IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
        run: |
          terraform apply -auto-approve -var-file "$TERRAFORM_VAR_FILE" -no-color \
            -var "task_image=$IMAGE_NAME" \
            -var "task_image_tag=$IMAGE_TAG"
